
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BEATNOVA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080810;
            font-family: 'DM Sans', sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #141421;
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .reset-logo {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .reset-logo span {
            color: #a78bfa;
        }

        .reset-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: rgba(167, 139, 250, 0.12);
            color: #a78bfa;
            font-size: 30px;
        }

        .reset-card h2 {
            color: #fff;
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .reset-description {
            color: #a1a1b5;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .reset-card .input-group {
            margin-bottom: 20px;
        }

        .reset-card label {
            display: block;
            color: #d4d4e0;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .reset-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #303044;
            border-radius: 10px;
            background: #1c1c2c;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .reset-card input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #a1a1b5;
        }

        .back-login a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login a:hover {
            color: #fff;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-page">
        <div class="reset-card">

            <div class="reset-logo">
                BEAT<span>NOVA</span>
            </div>

            <div class="reset-icon">🔐</div>

            <h2>Reset Password</h2>

            <p class="reset-description">
                Enter your registered email and choose a new password
                to regain access to your account.
            </p>

            <form action="/forgot-password" method="POST">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="new_password">New Password</label>
                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your new password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="reset-btn">
                    Reset Password
                </button>

            </form>

            <div class="back-login">
                Remember your password?
                <a href="/login">Back to Login</a>
            </div>

        </div>
    </div>

</body>
</html>
